<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B2A52">
<meta name="referrer" content="no-referrer">
<title>Beat my time - Pocket Mania</title>
<meta property="og:title" content="Beat my time in Pocket Mania">
<meta property="og:description" content="Race this exact run in Pocket Mania, a stunt racing game for iPhone.">
<!-- The link preview's picture (D243): the fragment never reaches a server, so one picture for every link. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pocket Mania">
<meta property="og:url" content="https://n1mda.github.io/pocketmania-privacy/g/">
<meta property="og:image" content="https://n1mda.github.io/pocketmania-privacy/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A race car on a night track in Pocket Mania">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://n1mda.github.io/pocketmania-privacy/share.jpg">
<!-- Safari's banner: Open when the game is on this phone, Get when it is not. -->
<meta name="apple-itunes-app" content="app-id=6828433552" id="banner">
<!--
  The fallback page of a beat-my-ghost link (decisions.md D234). Copied to the
  pocketmania-privacy repository as g/index.html (https://n1mda.github.io/pocketmania-privacy/g/).
  The fragment (#...), which the browser never sends to a server, is
  base64url (no padding) of JSON {"v":1, "g": ghost id, "t": track name,
  "a": alias, "ms": time}. The ghost itself is in CloudKit; only the game reads it.
  "Beat this time" opens the game (pocketmania://g/#...); if the page is
  still in front a moment later, the game is not installed: the App Store.
  No external scripts, nothing stored, nothing sent.
-->
<link rel="preload" href="../fonts/saira-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../site.css">
</head>
<body>
<video class="race" autoplay muted loop playsinline preload="auto" poster="../race.jpg" aria-hidden="true" tabindex="-1">
  <source src="../race.mp4" type="video/mp4">
</video>
<div class="shade" aria-hidden="true"></div>
<header class="top"><img class="wordmark" src="../wordmark.png" alt="Pocket Mania" width="1400" height="160"></header>
<main class="content">
  <div class="heading">
    <p class="eyebrow" id="who">A friend challenges you</p>
    <h1 id="track">Beat my time</h1>
  </div>
  <div class="timer" id="time-box" hidden>
    <span class="label">Time to beat</span>
    <span class="digits" id="time"></span>
  </div>
  <div class="actions">
    <a class="plate primary" id="open" href="pocketmania://g/">Beat this time</a>
    <a class="badge" id="store" href="https://apps.apple.com/app/id6828433552"><img src="../app-store-badge.svg" alt="Download on the App Store" width="162" height="54"></a>
  </div>
  <p class="note" id="note">Free on iPhone and iPad. Already have it? Tap Beat this time to race this exact run.</p>
</main>
<script>
"use strict";
// Reduced motion: the race's still frame (the poster) instead of the loop.
if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const race = document.querySelector(".race");
  race.removeAttribute("autoplay");
  race.pause();
}
const STORE = "https://apps.apple.com/app/id6828433552";

function readFragment(data) {
  if (!/^[A-Za-z0-9_-]{1,2048}$/.test(data) || data.length % 4 === 1) return null;
  let b64 = data.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  try {
    const raw = atob(b64);
    const bytes = Uint8Array.from(raw, c => c.charCodeAt(0));
    const g = JSON.parse(new TextDecoder().decode(bytes));
    if (!g || g.v !== 1 || typeof g.g !== "string" || !/^[a-z0-9]{12}$/.test(g.g)) return null;
    return g;
  } catch (e) { return null; }
}

function formatTime(ms) {
  const cs = Math.floor(ms / 10);
  return Math.floor(cs / 6000) + ":" + String(Math.floor(cs / 100) % 60).padStart(2, "0") + "." + String(cs % 100).padStart(2, "0");
}

const data = location.hash.slice(1);
const ghost = readFragment(data);
if (!ghost) {
  document.getElementById("who").textContent = "This link has no time in it.";
  document.getElementById("track").textContent = "Pocket Mania";
  document.getElementById("open").style.display = "none";
  document.getElementById("note").textContent = "Ask your friend to send it again.";
} else {
  const name = typeof ghost.t === "string" && ghost.t ? ghost.t.slice(0, 32) : "";
  const alias = typeof ghost.a === "string" && ghost.a ? ghost.a.slice(0, 64) : "";
  document.getElementById("who").textContent = alias ? alias + " challenges you" : "A friend challenges you";
  if (name) document.getElementById("track").textContent = name;
  if (Number.isInteger(ghost.ms) && ghost.ms > 0 && ghost.ms <= 3600000) {
    document.getElementById("time").textContent = formatTime(ghost.ms);
    document.getElementById("time-box").hidden = false;
  }
  document.title = (name ? "Beat my time on " + name : "Beat my time") + " - Pocket Mania";
  const scheme = "pocketmania://g/#" + data;
  document.getElementById("banner").content = "app-id=6828433552, app-argument=" + scheme;
  const open = document.getElementById("open");
  open.href = scheme;
  // The game opens and this page goes to the background; if it does not, the
  // game is not on this phone: the App Store instead.
  open.addEventListener("click", () => {
    let left = false;
    const away = () => { left = true; };
    document.addEventListener("visibilitychange", () => { if (document.hidden) away(); }, { once: true });
    window.addEventListener("pagehide", away, { once: true });
    window.addEventListener("blur", away, { once: true });
    setTimeout(() => { if (!left && !document.hidden) location.href = STORE; }, 1600);
  });
}
// Another link opened in this tab changes only the fragment: read it afresh.
window.addEventListener("hashchange", () => location.reload());
</script>
</body>
</html>
